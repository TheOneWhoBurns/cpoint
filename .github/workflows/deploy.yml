name: Deploy to Production

on:
  push:
    branches: [rental-system]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/rental-system
            git pull origin rental-system
            npm ci
            npm run build
            npm run db:push
            sudo systemctl restart rental-app
            sleep 5
            curl -f http://localhost:3000/health

      - name: Verify deployment
        if: success()
        run: echo "Deployment successful to production"

      - name: Notify failure
        if: failure()
        run: echo "Deployment failed - check logs and consider rollback"
